# Metis Configuration

# Application metadata
application:
  name: "Metis"
  description: "Type two diabetes treatment optimization system"
  version: ${APP_VERSION}

# Security & Secrets
security:
  # JWT Configuration
  jwt:
    secret_key: ${JWT_SECRET_KEY}
    refresh_secret_key: ${JWT_REFRESH_SECRET_KEY}
    access_token_expires: ${JWT_ACCESS_TOKEN_EXPIRES}
    refresh_token_expires: ${JWT_REFRESH_TOKEN_EXPIRES}
    algorithm: "HS256"
    token_location: ["headers"]

  # Password hashing
  password:
    bcrypt_rounds: ${BCRYPT_ROUNDS}

# Server configuration
server:
  cors_allowed_origins: ${CORS_ALLOWED_ORIGINS}
  ip: ${SERVER_IP}
  port: ${SERVER_PORT}
  debug: ${FLASK_DEBUG}
  ssl:
    enabled: ${SSL_ENABLED}
    key_path: ${SSL_KEY_PATH}
    cert_path: ${SSL_CERT_PATH}

# Database configuration
database:
  uri: ${DATABASE_URI}
  track_modifications: false
  pool_size: ${DB_POOL_SIZE}
  max_overflow: ${DB_MAX_OVERFLOW}
  pool_timeout: 30
  pool_recycle: 1800
  echo: ${DB_ECHO}
  pool_pre_ping: true

# External API keys & ML Configuration
integrations:
  ai:
    gemini:
      api_key: ${GEMINI_API_KEY}
      model: ${GEMINI_MODEL_NAME}

  ml_model:
    # Model paths
    models_dir: ${ML_MODELS_DIR}
    scaler_path: ${ML_SCALER_PATH}
    preprocessing_metadata_path: ${ML_PREPROCESSING_METADATA_PATH}

    # Model settings
    model_version: ${ML_MODEL_VERSION}  # Empty = use active version
    auto_activate: ${ML_AUTO_ACTIVATE}
    verbose: ${ML_VERBOSE}

  graph_database:
    uri: ${NEO4J_URI}
    username: ${NEO4J_USERNAME}
    password: ${NEO4J_PASSWORD}

# Logging configuration
logging:
  level: ${LOG_LEVEL}
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: ${LOG_FILE_PATH}